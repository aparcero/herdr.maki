# Permission requests for the maki-plugins collection. Maki asks about these
# separately from the install prompt, and remembers the answer per package
# name and source.
#
# Herdr uses env, run, and fs_read. ast-grep uses env and run. zai-local
# uses env and net restricted to api.z.ai; it registers the provider below.
#
# ast-grep rewrites files through its subprocess, without Lua fs_write.

min_maki_version = "0.7.0"
providers = ["zai-local"]

[permissions]
env = true
run = true
fs_read = true
net = true
net_hosts = ["api.z.ai"]
